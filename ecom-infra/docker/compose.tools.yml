services:
  prisma_studio:
    image: node:20-bookworm-slim
    container_name: ecom_prisma_studio
    working_dir: /app
    env_file:
      - ../.env
    environment:
      CI: "true"
    volumes:
      - ${API_REPO_PATH:-../ecom-api}:/app
      - /app/node_modules
    command: >
      sh -lc "
      apt-get update -y &&
      apt-get install -y --no-install-recommends openssl ca-certificates &&
      rm -rf /var/lib/apt/lists/* &&
      corepack enable &&
      pnpm install &&
      pnpm exec prisma generate &&
      pnpm exec prisma studio --hostname 0.0.0.0 --port ${PRISMA_STUDIO_PORT:-5555}
      "
    ports:
      - "${PRISMA_STUDIO_PORT:-5555}:5555"
    networks:
      - ecom_net

networks:
  ecom_net:
    external: true
