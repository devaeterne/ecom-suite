services:
  api:
    image: node:20-bookworm-slim
    container_name: ecom_api
    working_dir: /app
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-3001}
      CI: "true"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-ecom}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}

      TENANT_CONFIG_PATH: ${TENANT_CONFIG_PATH:-/app/deploy/tenant.json}

    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      # API repo: ecom-infra/.. -> ecom-api
      - ${API_REPO_PATH}:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

    # Dev ergonomisi: tek sefer setup + watch
    command: >
      sh -lc "
      apt-get update -y &&
      apt-get install -y --no-install-recommends openssl ca-certificates &&
      rm -rf /var/lib/apt/lists/* &&
      corepack enable &&
      pnpm -v &&
      if [ ! -f package.json ]; then echo '❌ /app içinde package.json yok (API_REPO_PATH yanlış)'; ls -la /app; exit 1; fi &&
      pnpm install &&
      pnpm exec prisma generate &&
      pnpm exec prisma migrate deploy || true &&
      pnpm exec nest start --watch
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [ecom_net]
  
networks:
  ecom_net:
    external: true
    name: ecom_net

