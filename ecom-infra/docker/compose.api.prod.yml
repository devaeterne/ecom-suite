services:
  api:
    container_name: ecom_api
    build:
      context: ${API_REPO_PATH:-../ecom-api}
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT:-3001}

      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-ecom}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}

      TENANT_CONFIG_PATH: ${TENANT_CONFIG_PATH:-/app/deploy/tenant.json}

    ports:
      - "${API_PORT:-3001}:3001"

    # Prod: volume mount yok. Image immutable.
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 15

    networks:
      - ecom_net

networks:
  ecom_net:
    external: true
    name: ecom_net
