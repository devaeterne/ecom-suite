name: ecom_admin

services:
  admin:
    image: node:20-bookworm-slim
    container_name: ecom_admin
    working_dir: /app
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      # Admin Next.js'in API'ye nasıl gideceği (browser tarafı için localhost gerekir)
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${API_PORT:-3001}}
      PORT: ${ADMIN_PORT:-3002}
      HOSTNAME: 0.0.0.0
    ports:
      - "${ADMIN_PORT:-3002}:3002"
    volumes:
      # Admin repo mount
      - ${ADMIN_REPO_PATH:-../admin}:/app
    command: >
      sh -lc "
      corepack enable &&
      pnpm -v &&
      pnpm install &&
      pnpm dev -p 3002
      "
    networks:
      - ecom_net

networks:
  ecom_net:
    external: true

