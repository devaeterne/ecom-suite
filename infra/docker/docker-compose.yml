name: ecom_suite

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecom_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecom}
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecom} -d ${POSTGRES_DB:-ecom}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ecom_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    #healthcheck:
    #  test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
    #  interval: 5s
    #  timeout: 3s
    #  retries: 20
    restart: unless-stopped

  # MinIO bucket init (idempotent)
  minio_init:
    image: minio/mc:latest
    container_name: ecom_minio_init
    #depends_on:
    #  minio:
    #    condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      echo '⏳ Waiting for MinIO at http://minio:9000 ...';
      i=0;
      until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin}; do
        i=$$((i+1));
        if [ $$i -ge 60 ]; then
          echo '❌ MinIO not reachable after 120s';
          exit 1;
        fi;
        sleep 2;
      done;
      echo '✅ MinIO reachable. Ensuring bucket...';
      mc mb -p local/${MINIO_BUCKET:-ecom} || true;
      mc anonymous set download local/${MINIO_BUCKET:-ecom} || true;
      echo '✅ MinIO bucket ready: ${MINIO_BUCKET:-ecom}';
      "

    restart: "no"

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: ecom_api

    working_dir: /app

    # ✅ API'yi gerçekten başlat
    # - workspace root'ta pnpm install
    # - prisma generate (client)
    # - migrate (dev için: deploy; istersen dev'e çeviririz)
    # - ardından nest dev
    command: >
      sh -lc "
      corepack enable &&
      pnpm install --frozen-lockfile=false &&
      pnpm --filter @ecom/api prisma:generate &&
      pnpm --filter @ecom/api prisma:migrate:deploy &&
      pnpm --filter @ecom/api dev
      "

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-3001}

      DATABASE_URL: postgresql://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom_password}@postgres:5432/${POSTGRES_DB:-ecom}?schema=public

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ecom}
      MINIO_USE_SSL: "false"

      TENANT_CONFIG_PATH: /app/deploy/tenant.json

    ports:
      - "${API_PORT:-3001}:3001"

    volumes:
      - ../../apps/api:/app/apps/api
      - ../../packages:/app/packages
      - ../../prisma:/app/prisma
      - ../../deploy:/app/deploy:ro

      - ../../pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ../../package.json:/app/package.json:ro
      - ../../pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ../../turbo.json:/app/turbo.json:ro

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully

    restart: unless-stopped

  admin:
    build:
      context: ../../
      dockerfile: apps/admin/Dockerfile
    container_name: ecom_admin
    working_dir: /app/apps/admin
    command: sh -lc "pnpm install --frozen-lockfile=false && pnpm dev -p 3002"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    ports:
      - "3002:3002"
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - ../../apps/admin:/app/apps/admin
      - ../../packages:/app/packages
      - ../../prisma:/app/prisma
      - ../../pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ../../package.json:/app/package.json:ro
      - ../../pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ../../turbo.json:/app/turbo.json:ro

  storefront:
    build:
      context: ../../
      dockerfile: apps/storefront/Dockerfile
    container_name: ecom_storefront
    working_dir: /app/apps/storefront
    command: sh -lc "pnpm install --frozen-lockfile=false && pnpm dev -p 3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - ../../apps/storefront:/app/apps/storefront
      - ../../packages:/app/packages
      - ../../prisma:/app/prisma
      - ../../pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ../../package.json:/app/package.json:ro
      - ../../pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ../../turbo.json:/app/turbo.json:ro


volumes:
  postgres_data:
  redis_data:
  minio_data:
